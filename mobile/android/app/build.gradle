// build.gradle (niveau app)

plugins {
    id "com.android.application"  // Le plugin Android pour créer l'application
    id "kotlin-android"  // Plugin Kotlin pour Android (si tu utilises Kotlin)
    id "dev.flutter.flutter-gradle-plugin"  // Plugin Flutter pour Gradle
}

android {
    namespace = "com.example.mobile"  // Espace de noms pour ton application Android
    compileSdk = flutter.compileSdkVersion  // Utilise la version du SDK de compilation définie dans Flutter
    ndkVersion = flutter.ndkVersion  // Version NDK de Flutter

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8  // Définir la compatibilité Java à 1.8
        targetCompatibility = JavaVersion.VERSION_1_8  // Cibler Java 1.8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8  // Cibler Java 1.8 pour Kotlin
    }

    defaultConfig {
        applicationId = "com.example.mobile"  // Identifiant unique de l'application
        minSdk = flutter.minSdkVersion  // Version minimale du SDK définie par Flutter
        targetSdk = flutter.targetSdkVersion  // Version du SDK ciblée par Flutter
        versionCode = flutter.versionCode  // Code de version Flutter
        versionName = flutter.versionName  // Nom de version Flutter
    }

    buildTypes {
        release {
            // Utiliser la configuration de signature de debug (à changer pour la production)
            signingConfig = signingConfigs.debug  // Utiliser la configuration de signature de debug pour l'instant
        }
    }
}

flutter {
    source = "../.."  // Source Flutter pour la configuration du projet
}
